name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuss
          POSTGRES_PASSWORD: cuss
          POSTGRES_DB: cuss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuss -d cuss"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://cuss:cuss@localhost:5432/cuss
