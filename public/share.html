<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Try Cuss · Scan me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: auto; }
    .share { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; position: relative; overflow: hidden; }
    .share-card { text-align: center; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 32px; padding: 40px 36px; box-shadow: var(--shadow-lg); backdrop-filter: blur(16px); animation: pop .6s var(--ease) both; }
    .share-card h1 { font-size: clamp(34px, 5vw, 56px); letter-spacing: -.03em; margin: 14px 0 6px; font-weight: 800; }
    .share-card p { color: var(--muted); font-size: 18px; margin: 0 0 26px; }
    .qr { background: #fff; padding: 18px; border-radius: 24px; display: inline-block; box-shadow: 0 20px 60px rgb(124 58 237 / 35%); }
    .qr img { width: min(48vmin, 380px); height: auto; display: block; }
    .url { margin-top: 22px; font-weight: 700; font-size: 20px; word-break: break-all; }
    .steps-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 14px; }
    .steps-row span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  </style>
</head>
<body class="login-page">
  <div class="share">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="share-card">
      <div class="logo big">C</div>
      <h1>Try <span class="grad-text">Cuss</span> now</h1>
      <p>Your semester, handled. Scan with your phone camera.</p>
      <div class="qr"><img src="/qr.svg" alt="QR code to open Cuss" /></div>
      <div class="url" id="url"></div>
      <div class="steps-row"><span>1 · Scan</span><span>2 · Tap “Try the live demo”</span><span>3 · Ask “What's due?”</span></div>
    </div>
  </div>
  <script>
    fetch("/share-info").then((r) => r.json()).then(({ url }) => (document.getElementById("url").textContent = url.replace(/^https?:\/\//, "")));
  </script>
</body>
</html>
