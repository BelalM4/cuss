services:
  - type: web
    name: cuss
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /auth/info
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_TOKEN_LOGIN
        value: "false"
      - key: PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CANVAS_URL
        sync: false
      - key: CANVAS_CLIENT_ID
        sync: false
      - key: CANVAS_CLIENT_SECRET
        sync: false
