# One-click hosting on Render (https://render.com): New + → Blueprint → pick this repo.
# Only ANTHROPIC_API_KEY needs to be filled in; the public address is detected automatically.
services:
  - type: web
    name: cuss
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /auth/info
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "true"
      - key: AI_EFFORT
        value: low
      - key: DAILY_MESSAGE_LIMIT
        value: "40"
      - key: DAILY_TOTAL_LIMIT
        value: "400"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_TOKEN_LOGIN
        value: "false"
